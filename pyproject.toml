[project]
name = "kan-mlx-physics"
version = "0.3.0"
description = "Physics-first Kolmogorov-Arnold Networks for Apple Silicon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yael Tonatiuh Martínez Trejo", email = "yael@yael.science" }
]
maintainers = [
    { name = "Yael Tonatiuh Martínez Trejo", email = "yael@yael.science" }
]
requires-python = ">=3.10"
keywords = [
    "machine-learning",
    "neural-networks",
    "kan",
    "kolmogorov-arnold",
    "mlx",
    "apple-silicon",
    "physics",
    "pinn",
    "pde",
    "quantum-mechanics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core dependencies (minimal install)
dependencies = [
    "mlx>=0.21.0",
    "numpy>=1.24.0",
    "pykan>=0.2.8",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Visualization (matplotlib)
viz = [
    "matplotlib>=3.7.0",
]

# L-BFGS optimization and special functions
scipy = [
    "scipy>=1.11.0",
]

# Physics extras (symbolic math)
physics = [
    "sympy>=1.12",
    "scipy>=1.11.0",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]

# Benchmarking (PyKAN comparison)
benchmark = [
    "pykan>=0.2.0",
    "torch>=2.0.0",
    "psutil>=5.9.0",
]

# All optional dependencies
all = [
    "kan-mlx-physics[viz,scipy,physics,dev,docs,benchmark]",
]

[project.urls]
Homepage = "https://github.com/yaelmartinez/kan-mlx-physics"
Documentation = "https://github.com/yaelmartinez/kan-mlx-physics/tree/main/docs"
Repository = "https://github.com/yaelmartinez/kan-mlx-physics"
Issues = "https://github.com/yaelmartinez/kan-mlx-physics/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kan_mlx_physics"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/benchmarks",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
]

# uv configuration
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["kan_mlx_physics"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["src/kan_mlx_physics"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
